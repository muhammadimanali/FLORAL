name: Build Droidspaces Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex \
            libncurses-dev libssl-dev zip python3

      - name: Download Google Clang
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            --filter=blob:none \
            --sparse \
            $HOME/toolchains/clang-repo
          cd $HOME/toolchains/clang-repo
          git sparse-checkout set clang-r475365b
          mv clang-r475365b $HOME/toolchains/clang

      - name: Download GCC ARM64
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $HOME/toolchains/gcc64

      - name: Download GCC ARM32
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $HOME/toolchains/gcc32

      - name: Download AOSP DTC
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/external/dtc $HOME/aosp-dtc
          make -C $HOME/aosp-dtc

      - name: Merge defconfig with Droidspaces config
        run: |
          export ARCH=arm64
          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc64/bin:$HOME/toolchains/gcc32/bin:$PATH"
          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out kirisakura_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/droidspaces.config
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc64/bin:$HOME/toolchains/gcc32/bin:$PATH"
          export DTC_EXT=$HOME/aosp-dtc/dtc
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LD_LIBRARY_PATH=$HOME/toolchains/clang/lib64:$LD_LIBRARY_PATH
          make CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out -j$(nproc)

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flame-droidspaces
          path: out/arch/arm64/boot/Image.lz4-dtb
